name: Nightly Mobilize event sync

# Mirrors upcoming in-person Solidarity events into Mobilize: creates ones that
# are new, and pushes edits (title, times, description, image) to ones already
# mirrored.
#
# 06:20 UTC = 02:20 EDT / 01:20 EST — after the day's events have been created
# in Solidarity and well before volunteers are browsing. Two staggered attempts
# because GitHub cron is best-effort and delays of hours are routine (see
# door-knock-snapshot.yml). Re-running is harmless: a Turso ledger records every
# event created, so a second run updates instead of duplicating.
#
# Requires MOBILIZE_API_KEY and MOBILIZE_ORG_ID on the Fly app, plus an event
# contact (set on /settings, or MOBILIZE_CONTACT_EMAIL). The key must have write
# access — creating events and uploading images are "restricted" endpoints
# Mobilize grants per organization. If it is rejected this run goes red and the
# app posts a Slack alert.
#
# The sync is driven as a LOOP of bounded requests, not one long one. fly-proxy
# decides a machine is excess capacity from its concurrency limits, which do not
# count requests in flight, so it autostopped a machine six minutes into a sync
# and the caller got a 502 with the run half-done. Each request now stops at its
# time budget and reports `incomplete`; this loops until that is false. The Turso
# ledger is what makes resuming safe.
on:
  schedule:
    - cron: '20 6 * * *'
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only — report what would change without writing'
        type: boolean
        default: false
      max_creates:
        description: 'Raise the create guardrail (default 25) for a deliberate bulk run'
        type: string
        default: ''
      budget_ms:
        description: 'Milliseconds one request may spend before it stops and reports the rest as pending (default 120000)'
        type: string
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Mobilize sync
        env:
          APP_URL: https://slack-solidarity-helper-tools.fly.dev
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_CREATES: ${{ inputs.max_creates }}
          BUDGET_MS: ${{ inputs.budget_ms }}
          # Enough for a first bulk night (~15 image uploads at ~30s each) with
          # room to spare. The cap exists so a sync that cannot make progress
          # fails visibly instead of looping until the job timeout.
          MAX_CHUNKS: 12
        run: |
          QUERY="key=${INTERNAL_CRON_SECRET}"
          [ "${DRY_RUN}" = "true" ] && QUERY="${QUERY}&dry=1"
          [ -n "${MAX_CREATES}" ] && QUERY="${QUERY}&maxCreates=${MAX_CREATES}"
          [ -n "${BUDGET_MS}" ] && QUERY="${QUERY}&budgetMs=${BUDGET_MS}"

          for chunk in $(seq 1 "${MAX_CHUNKS}"); do
            echo "--- request ${chunk}/${MAX_CHUNKS}"

            # No --retry: the sync writes, and the endpoint answers 503 for the
            # two states a retry cannot fix (rejected key, aborted on the
            # guardrail). Its own ledger makes a re-run safe.
            if ! RESPONSE=$(curl --fail-with-body -sS -X POST \
              --max-time 300 \
              "${APP_URL}/api/internal/mobilize-sync?${QUERY}"); then
              echo "${RESPONSE}"
              exit 1
            fi
            echo "${RESPONSE}" | jq .

            if [ "$(echo "${RESPONSE}" | jq -r '.incomplete')" != "true" ]; then
              echo "sync finished in ${chunk} request(s)"
              exit 0
            fi
          done

          echo "::error::still incomplete after ${MAX_CHUNKS} requests — check the" \
            "logs for an event failing every pass, or raise budget_ms"
          exit 1
