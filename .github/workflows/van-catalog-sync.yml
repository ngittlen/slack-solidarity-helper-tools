name: VAN turf catalog sync

# Pulls VAN's map regions into van_turfs so the turf page has something to
# show. Every 30 minutes during waking hours: turf gets cut and printed lists
# get generated during the day, and a volunteer who cannot see turf an
# organizer just published has no way to know it exists.
#
# Runs are idempotent — the endpoint upserts by mapRouteId and takes a
# sync_locks lock, so an overlapping or delayed run is a no-op rather than a
# double write. GitHub cron is best-effort and skipping one is harmless.
on:
  schedule:
    - cron: '7,37 11-23 * * *'
    - cron: '7 0-3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call VAN catalog sync endpoint
        env:
          APP_URL: https://slack.tools4abdul.com
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST \
            --max-time 300 \
            --retry 3 --retry-delay 30 --retry-connrefused \
            "${APP_URL}/api/internal/van-sync?key=${INTERNAL_CRON_SECRET}"
