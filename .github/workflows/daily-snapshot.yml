name: Daily Solidarity snapshot

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Call snapshot endpoint
        env:
          APP_URL: https://slack-solidarity-helper-tools.fly.dev
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST \
            --max-time 300 \
            --retry 3 --retry-delay 30 --retry-connrefused \
            "${APP_URL}/api/internal/solidarity-snapshot?key=${INTERNAL_CRON_SECRET}"
