name: Nightly door-knock snapshot

# GitHub cron is best-effort — delays of hours are routine (observed: a
# 02:00 UTC schedule firing at 05:55), and top-of-hour slots are the most
# congested, so this fires several staggered attempts at off-peak minutes.
# Runs are idempotent: the endpoint stamps rows with the day Openfield itself
# considers "today" (its server rolls over at midnight US Pacific, NOT ET; see
# openfieldDate in door-knock-snapshot.ts) and upserts, so every run before
# that rollover overwrites the same day with fresher totals and the last one
# stands. The safe capture window therefore runs until ~midnight Pacific
# (~3 am ET / 07:00 UTC): a straggler that lands after ET midnight but before
# then still correctly records the evening that just ended; only a run past
# the Pacific rollover writes the new day's early rows, which the next night
# overwrites. In EDT these fire 21:13 / 22:13 / 22:43 / 23:13; in EST 20:13 /
# 21:13 / 21:43 / 22:13 — all comfortably ahead of the Pacific rollover, so
# every one being delayed past it is vanishingly unlikely.
on:
  schedule:
    - cron: '13 1 * * *'
    - cron: '13 2 * * *'
    - cron: '43 2 * * *'
    - cron: '13 3 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Call door-knock snapshot endpoint
        env:
          APP_URL: https://slack.tools4abdul.com
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST \
            --max-time 300 \
            --retry 3 --retry-delay 30 --retry-connrefused \
            "${APP_URL}/api/internal/door-knock-snapshot?key=${INTERNAL_CRON_SECRET}"
