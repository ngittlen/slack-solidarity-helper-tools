name: Nightly door-knock snapshot

# 02:00 UTC = 22:00 EDT / 21:00 EST — after canvassing ends but with a wide
# buffer before Openfield's "today" (campaign-local, Michigan) rolls over,
# since GitHub's schedule can fire well past the requested minute. The
# endpoint stamps the row date in America/Detroit, so drift can't shift the
# day as long as it runs before ET midnight.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Call door-knock snapshot endpoint
        env:
          APP_URL: https://slack-solidarity-helper-tools.fly.dev
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST \
            --max-time 300 \
            --retry 3 --retry-delay 30 --retry-connrefused \
            "${APP_URL}/api/internal/door-knock-snapshot?key=${INTERNAL_CRON_SECRET}"
