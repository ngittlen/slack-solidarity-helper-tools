name: Nightly door-knock snapshot

# GitHub cron is best-effort — delays of hours are routine (observed: a
# 02:00 UTC schedule firing at 05:55), and top-of-hour slots are the most
# congested, so this fires several staggered attempts at off-peak minutes.
# Runs are idempotent: the endpoint stamps rows with the America/Detroit
# date and upserts, so every pre-midnight-ET run just overwrites the day
# with fresher totals and the last one stands; a straggler that lands past
# ET midnight harmlessly writes the new day's early rows, which the next
# night overwrites. In EDT these are 21:13 / 22:13 / 22:43 / 23:13; in EST
# 20:13 / 21:13 / 21:43 / 22:13 — several in-window attempts year-round,
# so all of them being delayed past midnight is vanishingly unlikely.
on:
  schedule:
    - cron: '13 1 * * *'
    - cron: '13 2 * * *'
    - cron: '43 2 * * *'
    - cron: '13 3 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Call door-knock snapshot endpoint
        env:
          APP_URL: https://slack-solidarity-helper-tools.fly.dev
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST \
            --max-time 300 \
            --retry 3 --retry-delay 30 --retry-connrefused \
            "${APP_URL}/api/internal/door-knock-snapshot?key=${INTERNAL_CRON_SECRET}"
