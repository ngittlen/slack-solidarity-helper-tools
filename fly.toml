# fly.toml app configuration file generated for slack-solidarity-helper-tools on 2026-04-10T01:17:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'slack-solidarity-helper-tools'
primary_region = 'ord'

[build]

[deploy]
  release_command = 'node bin/migrate.js'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '10s'
  method = 'GET'
  path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
