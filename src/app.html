<!doctype html>
<html lang="en" %theme.attr%>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Replaced in hooks.server.ts with the resolved theme's custom
		     properties. Server-rendered so there is no flash of the wrong
		     palette, and no client JS is involved in theming at all. -->
		%theme.style% %sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div>%sveltekit.body%</div>
	</body>
</html>
